name = "likka-worker"
main = "src/index.js"
compatibility_date = "2026-09-01"

# No content logging (documentación §7.2, §8): Workers Logs/tail off entirely.
[observability]
enabled = false

# 10 requests per minute per IP (period must be 10 or 60 seconds)
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
