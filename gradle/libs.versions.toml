[versions]
# compileSdk 35 caps the AndroidX versions: newer releases declare minCompileSdk 36+.
agp = "9.3.1"
kotlin = "2.4.20"
ktlintPlugin = "14.2.0"
ktlint = "1.8.0"
composeBom = "2026.06.01"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
appcompat = "1.7.1"
# Navigation 2.10+ and Lifecycle 2.11 declare minCompileSdk 37; these are the newest that accept compileSdk 35.
navigationCompose = "2.9.8"
lifecycle = "2.10.0"
junit = "4.13.2"
# JVM unit tests only: Android ships org.json in the platform, but the unit-test android.jar stubs it.
orgJson = "20231013"
# Same version that AndroidX already brings in transitively (checked with :app:dependencies).
kotlinxCoroutines = "1.9.0"
# Newest stable; its AARs declare minCompileSdk 34 and it needs kotlinx-coroutines 1.9.0 (the version above).
datastore = "1.2.1"
# The Worker client (RF-I05) and its MockWebServer tests (documentación §12.1); no Retrofit: one POST does not need it.
# 5.3.2 is the newest 5.x that accepts compileSdk 35 (5.4.0 needs 36, 5.5.0 needs 37).
okhttp = "5.3.2"
# Same coroutines line as kotlinxCoroutines above, for virtual time in JVM tests.
kotlinxCoroutinesTest = "1.9.0"
# Debug builds only (RF-O05, scenario M6). 2.14 is the newest stable on Maven Central (3.0 is still alpha);
# its AARs declare no minCompileSdk, so compileSdk 35 is fine.
leakcanary = "2.14"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Version comes from the Compose BOM.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
